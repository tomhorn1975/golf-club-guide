<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golf Guide">
    <meta name="theme-color" content="#1a5c38">
    <title>⛳ Golf Club Guide</title>
    <link rel="manifest" href="manifest.json">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: #f0f4f1;
            min-height: 100vh;
            padding-bottom: 48px;
        }

        .header {
            background: linear-gradient(160deg, #14472d 0%, #1f7a4a 100%);
            color: white;
            text-align: center;
            padding: 52px 20px 28px;
        }
        .header-icon { font-size: 44px; line-height: 1; }
        .header h1 {
            font-size: 30px;
            font-weight: 800;
            margin-top: 10px;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 15px;
            opacity: 0.75;
            margin-top: 5px;
        }

        .input-card {
            background: white;
            margin: 20px 16px;
            border-radius: 20px;
            padding: 24px 20px 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }
        .input-label {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
        }
        .distance-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        #distanceInput {
            font-size: 60px;
            font-weight: 800;
            color: #14472d;
            text-align: center;
            width: 170px;
            border: 3px solid #d8ede2;
            border-radius: 16px;
            padding: 6px 10px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background: #fafffe;
        }
        #distanceInput:focus { border-color: #1a5c38; }
        .yards-unit {
            font-size: 24px;
            font-weight: 700;
            color: #aaa;
        }
        .find-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #14472d, #1f7a4a);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.3px;
        }
        .find-btn:active { opacity: 0.82; }

        .no-result {
            display: none;
            text-align: center;
            margin: 0 16px;
            padding: 24px;
            background: #fff3cd;
            border-radius: 16px;
            color: #856404;
            font-size: 16px;
            font-weight: 600;
        }

        .result-card {
            display: none;
            margin: 0 16px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 30px rgba(0,0,0,0.13);
        }

        .club-banner {
            color: white;
            text-align: center;
            padding: 26px 20px 22px;
        }
        .club-distance-label {
            font-size: 13px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .club-name {
            font-size: 46px;
            font-weight: 900;
            margin: 6px 0 10px;
            letter-spacing: -1px;
            line-height: 1;
        }
        .swing-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border: 1.5px solid rgba(255,255,255,0.45);
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-top: 1px solid #efefef;
        }
        .panel-title {
            font-size: 12px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }
        .svg-wrap {
            background: #f5fbf7;
            border-radius: 14px;
            padding: 14px 10px;
        }
        .svg-wrap svg { width: 100%; height: auto; display: block; }

        .tip-row {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 11px 0;
            border-bottom: 1px solid #f3f3f3;
            font-size: 16px;
            color: #222;
            line-height: 1.45;
        }
        .tip-row:last-child { border-bottom: none; }
        .tip-check {
            min-width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e4f5ea;
            color: #1a5c38;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-icon">⛳</div>
    <h1>Golf Club Guide</h1>
    <p>Beginner — find your club by distance</p>
</div>

<div class="input-card">
    <div class="input-label">Distance to pin</div>
    <div class="distance-row">
        <input type="number" id="distanceInput" inputmode="numeric"
               placeholder="150" min="1" max="300" autocomplete="off">
        <span class="yards-unit">yds</span>
    </div>
    <button class="find-btn" onclick="findClub()">Find My Club &rarr;</button>
</div>

<div class="no-result" id="noResult">
    Enter a distance between 1 and 300 yards.
</div>

<div class="result-card" id="resultCard"></div>

<script>
const clubs = [
    {
        name: "Driver",
        range: [180, 300],
        ballPos: 0.12,
        ballPosLabel: "Forward — off front heel",
        stanceWidth: "wide",
        weight: 0.35,
        weightLabel: "60% back foot",
        swingType: "Full Swing",
        color: "#0d3b6e",
        tips: [
            "Tee the ball high — half the ball above the clubface",
            "Weight slightly on your back foot at address",
            "Sweep UP through the ball — don't hit down",
            "Keep your head behind the ball through impact",
            "Only used off a tee — never from the fairway"
        ]
    },
    {
        name: "3-Wood",
        range: [160, 179],
        ballPos: 0.18,
        ballPosLabel: "Forward in stance",
        stanceWidth: "wide",
        weight: 0.45,
        weightLabel: "Even, slightly back",
        swingType: "Full Swing",
        color: "#1a4a8a",
        tips: [
            "Tee low or hit from the fairway",
            "Sweep through — think 'brush the grass'",
            "Full shoulder turn for max distance",
            "Stay centered — don't sway"
        ]
    },
    {
        name: "5-Wood",
        range: [145, 159],
        ballPos: 0.22,
        ballPosLabel: "Forward of center",
        stanceWidth: "wide",
        weight: 0.48,
        weightLabel: "Even — 50 / 50",
        swingType: "Full Swing",
        color: "#1e5fa0",
        tips: [
            "Ball slightly forward of center",
            "Smooth tempo — don't force it",
            "Great from the fairway or light rough",
            "Follow through high toward your target"
        ]
    },
    {
        name: "4-Hybrid",
        range: [130, 144],
        ballPos: 0.27,
        ballPosLabel: "Just forward of center",
        stanceWidth: "medium",
        weight: 0.5,
        weightLabel: "Even — 50 / 50",
        swingType: "Full Swing",
        color: "#1a5fa0",
        tips: [
            "More forgiving than a long iron",
            "Swing like an iron — slight downward strike",
            "Ball slightly forward of center",
            "Excellent from rough or fairway"
        ]
    },
    {
        name: "5-Iron",
        range: [115, 129],
        ballPos: 0.32,
        ballPosLabel: "Forward of center",
        stanceWidth: "medium",
        weight: 0.5,
        weightLabel: "Even — 50 / 50",
        swingType: "Full Swing",
        color: "#14472d",
        tips: [
            "Ball just ahead of center",
            "Hit down and through — take a divot",
            "Keep your head still through impact",
            "Full follow-through toward the target"
        ]
    },
    {
        name: "6-Iron",
        range: [105, 114],
        ballPos: 0.4,
        ballPosLabel: "Just forward of center",
        stanceWidth: "medium",
        weight: 0.5,
        weightLabel: "Even — 50 / 50",
        swingType: "Full Swing",
        color: "#1a5c38",
        tips: [
            "Ball just forward of center",
            "Compress the ball — hit down",
            "Hips rotate to face target on follow-through",
            "Good scoring club — be deliberate"
        ]
    },
    {
        name: "7-Iron",
        range: [90, 104],
        ballPos: 0.5,
        ballPosLabel: "Center of stance",
        stanceWidth: "medium",
        weight: 0.5,
        weightLabel: "Even — 50 / 50",
        swingType: "Full Swing",
        color: "#2e7d52",
        tips: [
            "Ball dead center of your stance",
            "Hit down through the ball",
            "Weight shifts to front foot at impact",
            "Most versatile beginner club — great for practice"
        ]
    },
    {
        name: "8-Iron",
        range: [80, 89],
        ballPos: 0.56,
        ballPosLabel: "Just back of center",
        stanceWidth: "medium",
        weight: 0.52,
        weightLabel: "Even — 50 / 50",
        swingType: "Full Swing",
        color: "#388e5c",
        tips: [
            "Ball just behind center",
            "Controlled full swing",
            "Hands slightly ahead at address",
            "Good approach shot club"
        ]
    },
    {
        name: "9-Iron",
        range: [70, 79],
        ballPos: 0.62,
        ballPosLabel: "Center to slightly back",
        stanceWidth: "medium-narrow",
        weight: 0.55,
        weightLabel: "55% front foot",
        swingType: "Full Swing",
        color: "#4caf70",
        tips: [
            "Ball center to slightly back",
            "Slightly shorter backswing for control",
            "Aim to take a divot after the ball",
            "High, soft approach shots"
        ]
    },
    {
        name: "Pitching Wedge",
        range: [55, 69],
        ballPos: 0.66,
        ballPosLabel: "Center-back of stance",
        stanceWidth: "narrow",
        weight: 0.58,
        weightLabel: "60% front foot",
        swingType: "3/4 Swing",
        color: "#e67e22",
        tips: [
            "Narrow, slightly open stance",
            "Ball center-back of stance",
            "3/4 backswing — don't go full",
            "Firm wrists through impact — don't flip"
        ]
    },
    {
        name: "Gap Wedge",
        range: [45, 54],
        ballPos: 0.68,
        ballPosLabel: "Center-back of stance",
        stanceWidth: "narrow",
        weight: 0.60,
        weightLabel: "60% front foot",
        swingType: "Half Swing",
        color: "#d35400",
        tips: [
            "Open your stance slightly toward the target",
            "Half to 3/4 backswing",
            "Accelerate through — never slow down at impact",
            "Let the loft do the work"
        ]
    },
    {
        name: "Sand Wedge",
        range: [30, 44],
        ballPos: 0.55,
        ballPosLabel: "Center of stance",
        stanceWidth: "narrow",
        weight: 0.55,
        weightLabel: "55% front foot",
        swingType: "Chip / Half Swing",
        color: "#b03a2e",
        tips: [
            "Open your stance toward the target",
            "Open the clubface slightly before gripping",
            "From sand: aim 2 inches behind the ball",
            "Accelerate through impact — never decelerate"
        ]
    },
    {
        name: "Lob Wedge",
        range: [0, 29],
        ballPos: 0.33,
        ballPosLabel: "Forward in stance",
        stanceWidth: "narrow",
        weight: 0.5,
        weightLabel: "Even — 50 / 50",
        swingType: "Chip / Flop Shot",
        color: "#7b241c",
        tips: [
            "Open the clubface wide before gripping",
            "Ball forward in stance",
            "Swing along your foot line (not the target line)",
            "High, soft shot — great around the green"
        ]
    }
];

/* ── Helpers ── */
function stanceFeet(sw) {
    if (sw === 'wide')          return [42, 218];
    if (sw === 'medium')        return [60, 200];
    if (sw === 'medium-narrow') return [74, 186];
    return [88, 172]; // narrow
}

/* ── Setup-at-a-glance infographic ── */
function setupSVG(ballPos, ballPosLabel, stanceWidth, weight, weightLabel) {
    const [lx, rx] = stanceFeet(stanceWidth);
    const TRACK_L = 14, TRACK_W = 232;
    const ballX   = Math.round(TRACK_L + ballPos * TRACK_W);
    const weightX = Math.round(TRACK_L + weight  * TRACK_W);
    const cx = 130;

    const stanceLabels = {
        'wide':          'Wider than shoulder width',
        'medium':        'Shoulder width',
        'medium-narrow': 'Slightly inside shoulder width',
        'narrow':        'Narrow — inside shoulder width'
    };
    const swLabel = stanceLabels[stanceWidth] || stanceWidth;

    /* keep label text on screen for extreme positions */
    const bLabelAnchor = ballX < 80 ? 'start' : ballX > 180 ? 'end' : 'middle';
    const bLabelX      = ballX < 80 ? TRACK_L : ballX > 180 ? TRACK_L + TRACK_W : ballX;
    const wLabelAnchor = weightX < 80 ? 'start' : weightX > 180 ? 'end' : 'middle';
    const wLabelX      = weightX < 80 ? TRACK_L : weightX > 180 ? TRACK_L + TRACK_W : weightX;

    return `<svg viewBox="0 0 260 248" xmlns="http://www.w3.org/2000/svg">

  <!-- ① BALL POSITION -->
  <text x="14" y="19" font-size="10" font-weight="800" fill="#aaa" font-family="-apple-system,sans-serif" letter-spacing="1.5">BALL POSITION</text>
  <text x="14"  y="36" font-size="12" fill="#666" font-family="-apple-system,sans-serif">Front foot</text>
  <text x="246" y="36" font-size="12" fill="#666" font-family="-apple-system,sans-serif" text-anchor="end">Back foot</text>
  <rect  x="${TRACK_L}" y="42" width="${TRACK_W}" height="10" rx="5" fill="#e0e0e0"/>
  <rect  x="${TRACK_L}" y="42" width="${ballPos * TRACK_W}" height="10" rx="5" fill="#1a5c38" opacity="0.22"/>
  <circle cx="${ballX}" cy="47" r="15" fill="white" stroke="#1a5c38" stroke-width="3"/>
  <circle cx="${ballX}" cy="47" r="6"  fill="#1a5c38"/>
  <text x="${bLabelX}" y="74" text-anchor="${bLabelAnchor}" font-size="13" fill="#1a5c38" font-weight="700" font-family="-apple-system,sans-serif">${ballPosLabel}</text>

  <!-- ② STANCE WIDTH -->
  <text x="14" y="100" font-size="10" font-weight="800" fill="#aaa" font-family="-apple-system,sans-serif" letter-spacing="1.5">STANCE WIDTH</text>
  <ellipse cx="${lx}" cy="122" rx="22" ry="11" fill="#5D4037" opacity="0.85"/>
  <text x="${lx}" y="140" text-anchor="middle" font-size="10" fill="#777" font-family="-apple-system,sans-serif" font-weight="700">FRONT</text>
  <ellipse cx="${rx}" cy="122" rx="22" ry="11" fill="#5D4037" opacity="0.85"/>
  <text x="${rx}" y="140" text-anchor="middle" font-size="10" fill="#777" font-family="-apple-system,sans-serif" font-weight="700">BACK</text>
  <line x1="${lx+24}" y1="150" x2="${rx-24}" y2="150" stroke="#bbb" stroke-width="1.5"/>
  <line x1="${lx+24}" y1="146" x2="${lx+24}" y2="154" stroke="#bbb" stroke-width="1.5"/>
  <line x1="${rx-24}" y1="146" x2="${rx-24}" y2="154" stroke="#bbb" stroke-width="1.5"/>
  <text x="${cx}" y="168" text-anchor="middle" font-size="13" fill="#444" font-family="-apple-system,sans-serif">${swLabel}</text>

  <!-- ③ WEIGHT DISTRIBUTION -->
  <text x="14" y="194" font-size="10" font-weight="800" fill="#aaa" font-family="-apple-system,sans-serif" letter-spacing="1.5">WEIGHT DISTRIBUTION</text>
  <text x="14"  y="210" font-size="12" fill="#666" font-family="-apple-system,sans-serif">Back foot</text>
  <text x="246" y="210" font-size="12" fill="#666" font-family="-apple-system,sans-serif" text-anchor="end">Front foot</text>
  <rect  x="${TRACK_L}" y="216" width="${TRACK_W}" height="10" rx="5" fill="#e0e0e0"/>
  <circle cx="${weightX}" cy="221" r="15" fill="white" stroke="#e06820" stroke-width="3"/>
  <circle cx="${weightX}" cy="221" r="6"  fill="#e06820"/>
  <text x="${wLabelX}" y="248" text-anchor="${wLabelAnchor}" font-size="13" fill="#e06820" font-weight="700" font-family="-apple-system,sans-serif">${weightLabel}</text>
</svg>`;
}

/* ── Main logic ── */
function findClub() {
    const val   = parseInt(document.getElementById('distanceInput').value, 10);
    const card  = document.getElementById('resultCard');
    const noRes = document.getElementById('noResult');

    noRes.style.display = 'none';
    card.style.display  = 'none';

    if (!val || isNaN(val) || val < 1 || val > 300) {
        noRes.style.display = 'block';
        return;
    }

    const club = clubs.find(c => val >= c.range[0] && val <= c.range[1]);
    if (!club) { noRes.style.display = 'block'; return; }

    const tips = club.tips.map(t =>
        `<div class="tip-row"><div class="tip-check">&#10003;</div><span>${t}</span></div>`
    ).join('');

    const rangeLabel = club.range[0] === 0
        ? 'Under 30 yards'
        : `${club.range[0]}&ndash;${club.range[1]} yard range`;

    card.innerHTML = `
        <div class="club-banner" style="background:linear-gradient(135deg,${club.color}ee,${club.color});">
            <div class="club-distance-label">${val} yds &rarr; ${rangeLabel}</div>
            <div class="club-name">${club.name}</div>
            <div class="swing-badge">${club.swingType}</div>
        </div>
        <div class="panel">
            <div class="panel-title">Setup at a Glance</div>
            <div class="svg-wrap">${setupSVG(club.ballPos, club.ballPosLabel, club.stanceWidth, club.weight, club.weightLabel)}</div>
        </div>
        <div class="panel">
            <div class="panel-title">Setup Tips</div>
            ${tips}
        </div>`;

    card.style.display = 'block';
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

document.getElementById('distanceInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') findClub();
});
</script>
</body>
</html>
